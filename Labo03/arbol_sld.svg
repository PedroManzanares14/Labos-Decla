<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1080" viewBox="0 0 1000 1080" role="img" aria-labelledby="title description">
  <title id="title">Arbol SLD para contar los digitos de 4729</title>
  <desc id="description">Resolucion recursiva de contar_digitos(4729, Cantidad), que termina con Cantidad igual a 4.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#316b63"/>
    </marker>
    <style>
      .bg { fill: #f7f8f4; }
      .title { font: 700 28px 'Segoe UI', sans-serif; fill: #183d3a; }
      .subtitle { font: 15px 'Segoe UI', sans-serif; fill: #536561; }
      .node { fill: #ffffff; stroke: #8ca9a0; stroke-width: 2; rx: 12; }
      .base { fill: #e6f2ec; stroke: #316b63; stroke-width: 2; rx: 12; }
      .code { font: 17px Consolas, monospace; fill: #20332f; }
      .note { font: 14px 'Segoe UI', sans-serif; fill: #536561; }
      .edge { stroke: #316b63; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .edge-label { font: 13px 'Segoe UI', sans-serif; fill: #316b63; }
      .result { font: 700 22px 'Segoe UI', sans-serif; fill: #183d3a; }
    </style>
  </defs>
  <rect class="bg" width="1000" height="1080"/>
  <text class="title" x="500" y="42" text-anchor="middle">Arbol SLD: contar_digitos(4729, Cantidad)</text>
  <text class="subtitle" x="500" y="68" text-anchor="middle">Rama exitosa de la consulta en contar_digitos.pl</text>

  <rect class="node" x="100" y="95" width="800" height="100"/>
  <text class="code" x="130" y="132">G0: contar_digitos(4729, Cantidad)</text>
  <text class="note" x="130" y="163">Se unifica con la regla principal; 4729 es un entero y abs(4729) = 4729.</text>

  <path class="edge" d="M500 195 L500 226"/>
  <text class="edge-label" x="515" y="216">regla principal</text>
  <rect class="node" x="100" y="230" width="800" height="100"/>
  <text class="code" x="130" y="267">G1: contar_digitos_aux(4729, Cantidad)</text>
  <text class="note" x="130" y="298">El caso base falla (4729 &lt; 10 es falso); se aplica la regla recursiva.</text>

  <path class="edge" d="M500 330 L500 361"/>
  <text class="edge-label" x="515" y="351">4729 // 10 = 472</text>
  <rect class="node" x="100" y="365" width="800" height="100"/>
  <text class="code" x="130" y="402">G2: contar_digitos_aux(472, C1), Cantidad is C1 + 1</text>
  <text class="note" x="130" y="433">472 cumple Numero &gt;= 10; se vuelve a aplicar la regla recursiva.</text>

  <path class="edge" d="M500 465 L500 496"/>
  <text class="edge-label" x="515" y="486">472 // 10 = 47</text>
  <rect class="node" x="100" y="500" width="800" height="100"/>
  <text class="code" x="130" y="537">G3: contar_digitos_aux(47, C2), C1 is C2 + 1</text>
  <text class="note" x="130" y="568">47 cumple Numero &gt;= 10; se vuelve a aplicar la regla recursiva.</text>

  <path class="edge" d="M500 600 L500 631"/>
  <text class="edge-label" x="515" y="621">47 // 10 = 4</text>
  <rect class="base" x="100" y="635" width="800" height="100"/>
  <text class="code" x="130" y="672">G4: contar_digitos_aux(4, C3)</text>
  <text class="note" x="130" y="703">4 &lt; 10: se unifica con el caso base y C3 = 1.</text>

  <path class="edge" d="M500 735 L500 766"/>
  <text class="edge-label" x="515" y="756">retorno: sumar 1 por cada nivel</text>
  <rect class="node" x="100" y="770" width="800" height="145"/>
  <text class="code" x="130" y="807">C2 = C3 + 1 = 2</text>
  <text class="code" x="130" y="839">C1 = C2 + 1 = 3</text>
  <text class="code" x="130" y="871">Cantidad = C1 + 1 = 4</text>

  <rect x="260" y="945" width="480" height="78" rx="12" fill="#183d3a"/>
  <text class="result" x="500" y="993" text-anchor="middle" fill="#ffffff">Respuesta: Cantidad = 4</text>
</svg>